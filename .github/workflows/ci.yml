name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# checks: write is required by dorny/test-reporter to publish the test report
permissions:
  contents: read
  checks: write

# A new push on the same branch cancels the run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.toolchain.name }} / ${{ matrix.config }}
    runs-on: ${{ matrix.toolchain.os }}

    strategy:
      fail-fast: false
      matrix:
        config: [ Debug, Release ]
        toolchain:
          - { name: MSVC, os: windows-latest, cc: cl, cxx: cl }
          - { name: GCC 14, os: ubuntu-24.04, cc: gcc-14, cxx: g++-14 }
          - { name: Clang 18, os: ubuntu-24.04, cc: clang-18, cxx: clang++-18 }

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # GLFW 3.4 builds both its X11 and Wayland backends on Linux.
      # Xvfb (virtual display) + Mesa (software OpenGL) run the GL tests.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xorg-dev libwayland-dev libxkbcommon-dev \
                                  xvfb libgl1 libgl1-mesa-dri

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_C_COMPILER=${{ matrix.toolchain.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.toolchain.cxx }}

      - name: Build
        run: cmake --build build --parallel

      # doctest's own JUnit reporter lists every test case
      # (ctest --output-junit would only see one test: the whole executable).
      # Linux: Mesa's software renderer (llvmpipe) gives a real OpenGL 4.5
      # context inside a virtual display. Windows runners have no GL 4.5
      # driver: the GL tests skip themselves.
      # bash on every OS (Git Bash on Windows) so one script fits all. Not used
      # for Configure/Build: Git Bash's own link.exe can shadow MSVC's linker
      #
      # doctest's JUnit reporter drops skipped test cases from the XML, so the
      # GL tests would just vanish from the Windows report. The console run's
      # totals ("N passed | M skipped") go to the job summary to keep the
      # skips visible. The tests take about a second: running twice is cheap.
      - name: Test
        shell: bash
        run: |
          run_tests() {
            if [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run -a ./build/bin/GEF_Tests "$@"
            else
              ./build/bin/GEF_Tests "$@"
            fi
          }

          # "shell: bash" runs with -e: capture the status instead of stopping,
          # so the summary is written even when a test fails
          status=0
          run_tests --reporters=junit --out=test-results.xml || status=$?

          run_tests --reporters=console --no-colors=true > test-console.txt 2>&1 || true
          {
            echo "## Tests (${{ matrix.toolchain.name }} / ${{ matrix.config }})"
            echo
            echo '```'
            grep -a -E '^\[doctest\] (test cases|assertions|Status)' test-console.txt || true
            echo '```'
            if grep -a -q -E 'test cases:.*\| *[1-9][0-9]* skipped' test-console.txt; then
              echo
              echo "> Skipped: OpenGL tests need a GL 4.5 context, which this runner does not provide."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit $status

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Tests (${{ matrix.toolchain.name }} / ${{ matrix.config }})
          path: test-results.xml
          reporter: java-junit

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.toolchain.name }}-${{ matrix.config }}
          path: |
            test-results.xml
            test-console.txt
          if-no-files-found: warn
          retention-days: 14
