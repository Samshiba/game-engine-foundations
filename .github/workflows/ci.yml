name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push on the same branch cancels the run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.toolchain.name }} / ${{ matrix.config }}
    runs-on: ${{ matrix.toolchain.os }}

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        toolchain:
          - { name: MSVC, os: windows-latest, cc: cl, cxx: cl }
          - { name: GCC 14, os: ubuntu-24.04, cc: gcc-14, cxx: g++-14 }
          - { name: Clang 18, os: ubuntu-24.04, cc: clang-18, cxx: clang++-18 }

    steps:
      - uses: actions/checkout@v4

      # GLFW 3.4 builds both its X11 and Wayland backends on Linux
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xorg-dev libwayland-dev libxkbcommon-dev

      # Puts cl.exe and the Windows SDK on the PATH, so Ninja can drive MSVC
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_C_COMPILER=${{ matrix.toolchain.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.toolchain.cxx }}

      # Compile only: the runners have no GPU to open an OpenGL 4.5 context
      - name: Build
        run: cmake --build build --parallel
